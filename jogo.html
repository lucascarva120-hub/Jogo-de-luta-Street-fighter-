<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LACK FIGHT - Sistemas Advanced Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { background: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Arial Black', sans-serif; }
        
        #container { position: relative; border: 10px solid #1a1a1a; background: #000; border-radius: 8px; box-shadow: 0 0 50px rgba(0,0,0,1); }

        /* INTERFACE DE MENUS */
        #telaInicio, #mensagem { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; background: radial-gradient(circle, #1a1a1a 0%, #000 100%); }
        .titulo-jogo { font-size: 100px; color: #f1c40f; transform: skew(-15deg); text-shadow: 5px 5px 0 #c0392b; margin-bottom: 40px; }
        
        .btn-acao { padding: 20px 50px; font-size: 22px; font-weight: 900; cursor: pointer; border: none; text-transform: uppercase; transition: 0.3s; margin: 10px; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); }
        .btn-pvc { background: #fff; color: #000; }
        .btn-pvp { background: #e74c3c; color: #fff; }
        .btn-revanche { background: #2ecc71; color: #fff; }
        .btn-acao:hover { transform: scale(1.1); filter: brightness(1.2); }

        /* HUD DO COMBATE */
        #ui { position: absolute; display: none; width: 100%; padding: 40px; pointer-events: none; z-index: 10; justify-content: space-between; }
        .hud-player { width: 40%; position: relative; }
        
        .barra-vida-bg { height: 35px; width: 100%; border: 3px solid #fff; background: #441111; }
        .barra-vida-interna { height: 100%; width: 100%; transition: width 0.1s; }
        
        .barra-especial-bg { height: 12px; width: 100%; border: 2px solid #555; background: #111; margin-top: 5px; box-shadow: 0 0 5px #000; }
        .barra-especial-interna { height: 100%; width: 0%; background: #f1c40f; transition: width 0.2s; box-shadow: 0 0 10px #f1c40f; }

        #timer { color: #fff; font-size: 70px; font-weight: 900; margin-top: -10px; text-shadow: 3px 3px 0 #000; }

        /* Elementos visuais para contagem de Combos */
        .combo-texto { position: absolute; top: 65px; font-size: 28px; color: #f39c12; text-shadow: 2px 2px 0 #000; font-style: italic; opacity: 0; transition: opacity 0.2s, transform 0.2s; transform: scale(0.8); }
        #p1Combo { left: 0; }
        #p2Combo { right: 0; text-align: right; }
        .combo-ativo { opacity: 1; transform: scale(1) skewX(-10deg); }
    </style>
</head>
<body>

    <div id="container">
        <div id="telaInicio">
            <h1 class="titulo-jogo">LACK FIGHT</h1>
            <button class="btn-acao btn-pvc" onclick="iniciarJogo('PVC')">SISTEMA VS CPU</button>
            <button class="btn-acao btn-pvp" onclick="iniciarJogo('PVP')">SISTEMA VS SISTEMA</button>
        </div>

        <div id="ui">
            <div class="hud-player">
                <div style="color:white; margin-bottom:5px; text-shadow: 2px 2px 0 #000;">P1: MARTIAL HERO</div>
                <div class="barra-vida-bg"><div id="p1Health" class="barra-vida-interna" style="background: #e74c3c"></div></div>
                <div class="barra-especial-bg"><div id="p1Energy" class="barra-especial-interna"></div></div>
                <div id="p1Combo" class="combo-texto">0 HITS</div>
            </div>
            <div id="timer">60</div>
            <div class="hud-player">
                <div id="p2Label" style="color:white; margin-bottom:5px; text-align:right; text-shadow: 2px 2px 0 #000;">P2: SHADOW WARRIOR</div>
                <div class="barra-vida-bg"><div id="p2Health" class="barra-vida-interna" style="background: #3498db"></div></div>
                <div class="barra-especial-bg"><div id="p2Energy" class="barra-especial-interna"></div></div>
                <div id="p2Combo" class="combo-texto">0 HITS</div>
            </div>
        </div>

        <div id="mensagem" style="display:none">
            <h1 id="textoResultado" style="font-size: 60px; color: #f1c40f; margin-bottom: 20px; text-shadow: 3px 3px 0 #000;">K.O.</h1>
            <button class="btn-acao btn-revanche" onclick="resetarLuta()">REVANCHE</button>
            <button class="btn-acao" style="background:#555; color:white" onclick="location.reload()">MENU</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
    const canvas = document.querySelector('#gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 1024;
    canvas.height = 576;

    const gravity = 0.8;
    const path = './Sprites/'; 

    let jogoAtActive = false;
    let modo = 'PVP';
    let tempo = 60;
    let timerID;
    let tremor = 0;
    
    // --- GESTÃO DE ÁUDIO CONFIGURADA ---
    const musicaFundo = new Audio('guile.mp3');
    musicaFundo.loop = true;
    musicaFundo.volume = 0.15;

    // Apenas o som do Kamehameha ativo por enquanto
    const SOM_KAMEHAMEHA = 'kamehameha.mp3'; 

    function playSound(url, volume = 0.3, startTime = 6) {
        if (!jogoAtivo) return;
        const sound = new Audio(url);
        sound.volume = volume;
        sound.currentTime = startTime; // Corta o áudio para começar direto no disparo
        sound.play().catch(err => console.log("Arquivo de som não encontrado ou bloqueado:", url));
    }

    /* --- CLASSE PROJETIL E ULTIMATE --- */
    class Projetil {
        constructor({ pos, vel, cor, isUltimate = false }) {
            this.pos = pos;
            this.vel = vel;
            this.cor = cor;
            this.ativo = true;
            this.isUltimate = isUltimate;
            
            this.raio = isUltimate ? 25 : 12;
            this.dano = isUltimate ? 25 : 8;
        }
        desenhar() {
            ctx.save();
            ctx.shadowBlur = this.isUltimate ? 30 : 15;
            ctx.shadowColor = this.cor;
            ctx.fillStyle = this.cor;
            ctx.beginPath();
            ctx.arc(this.pos.x, this.pos.y, this.raio, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
        atualizar() {
            this.pos.x += this.vel.x;
            if (this.pos.x < -100 || this.pos.x > canvas.width + 100) this.ativo = false;
            this.desenhar();
        }
    }

    /* --- CLASSE SPRITE --- */
    class Sprite {
        constructor({ pos, imageSrc, scale = 1 }) {
            this.pos = pos;
            this.image = new Image();
            this.image.src = imageSrc;
            this.scale = scale;
        }
        draw() {
            if (this.image.complete && this.image.naturalWidth !== 0) {
                ctx.drawImage(this.image, this.pos.x, this.pos.y, canvas.width, canvas.height);
            } else {
                let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                grad.addColorStop(0, '#111324');
                grad.addColorStop(1, '#050508');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }
        update() { this.draw(); }
    }

    /* --- CLASSE FIGHTER --- */
    class Fighter {
        constructor({ pos, vel, offset, imageSrc, framesMax, sprites }) {
            this.pos = pos;
            this.vel = vel;
            this.width = 50;
            this.height = 150;
            this.lado = 1; 
            
            this.image = new Image();
            this.image.src = imageSrc;
            this.scale = 2.5;
            this.framesMax = framesMax;
            this.framesCurrent = 0;
            this.framesElapsed = 0;
            this.framesHold = 6;
            this.offset = offset;
            this.sprites = sprites;
            
            this.isAttacking = false;
            this.health = 100;
            this.energy = 0; 
            this.magias = []; 
            
            this.comboCount = 0;
            this.comboTimer = null;

            this.attackBox = { pos: { x: this.pos.x, y: this.pos.y }, width: 120, height: 50 };

            for (const sprite in this.sprites) {
                sprites[sprite].image = new Image();
                sprites[sprite].image.src = sprites[sprite].imageSrc;
            }
        }

        draw() {
            ctx.save();
            if (this.lado === -1) {
                ctx.scale(-1, 1);
                const destX = -this.pos.x + this.offset.x - (this.image.width / this.framesMax) * this.scale;
                ctx.drawImage(
                    this.image,
                    this.framesCurrent * (this.image.width / this.framesMax),
                    0,
                    this.image.width / this.framesMax,
                    this.image.height,
                    destX,
                    this.pos.y - this.offset.y,
                    (this.image.width / this.framesMax) * this.scale,
                    this.image.height * this.scale
                );
            } else {
                ctx.drawImage(
                    this.image,
                    this.framesCurrent * (this.image.width / this.framesMax),
                    0,
                    this.image.width / this.framesMax,
                    this.image.height,
                    this.pos.x - this.offset.x,
                    this.pos.y - this.offset.y,
                    (this.image.width / this.framesMax) * this.scale,
                    this.image.height * this.scale
                );
            }
            ctx.restore();
        }

        update() {
            this.draw();
            this.framesElapsed++;
            if (this.framesElapsed % this.framesHold === 0) {
                if (this.framesCurrent < this.framesMax - 1) this.framesCurrent++;
                else this.framesCurrent = 0;
            }

            this.attackBox.pos.x = this.lado === 1 ? this.pos.x + this.width : this.pos.x - this.attackBox.width;
            this.attackBox.pos.y = this.pos.y + 50;

            this.pos.x += this.vel.x;
            this.pos.y += this.vel.y;

            if (this.pos.y + this.height + this.vel.y >= canvas.height - 60) {
                this.vel.y = 0;
                this.pos.y = 366; 
            } else this.vel.y += gravity;

            if (this.pos.x < 0) this.pos.x = 0;
            if (this.pos.x + this.width > canvas.width) this.pos.x = canvas.width - this.width;
        }

        ganharEnergia(qtd) {
            this.energy += qtd;
            if (this.energy > 100) this.energy = 100;
        }

        adicionarCombo(idSeletorDom) {
            this.comboCount++;
            const elemento = document.querySelector(idSeletorDom);
            elemento.innerText = `${this.comboCount} ${this.comboCount === 1 ? 'HIT' : 'HITS'}`;
            elemento.classList.add('combo-ativo');

            if (this.comboTimer) clearTimeout(this.comboTimer);

            this.comboTimer = setTimeout(() => {
                this.comboCount = 0;
                elemento.classList.remove('combo-ativo');
            }, 1200);
        }

        attack() {
            if (!jogoAtivo) return;
            this.switchSprite('attack1');
            this.isAttacking = true;
            setTimeout(() => { this.isAttacking = false; }, 400);
        }

        lancarMagia(cor) {
            if (!jogoAtivo || this.magias.length >= 2) return; 
            this.magias.push(new Projetil({
                pos: { x: this.lado === 1 ? this.pos.x + this.width + 10 : this.pos.x - 10, y: this.pos.y + 65 },
                vel: { x: 12 * this.lado, y: 0 },
                cor: cor
            }));
        }

        lancarUltimate(cor) {
            if (!jogoAtivo || this.energy < 100) return;
            this.energy = 0; 
            
            // Toca apenas o som do Kamehameha (cortando o início do carregamento de voz)
            // mude o '1.5' se precisar ajustar o momento do estouro!
            playSound(SOM_KAMEHAMEHA, 0.6, 1.5); 

            this.magias.push(new Projetil({
                pos: { x: this.lado === 1 ? this.pos.x + this.width + 20 : this.pos.x - 20, y: this.pos.y + 65 },
                vel: { x: 20 * this.lado, y: 0 }, 
                cor: cor,
                isUltimate: true
            }));
        }

        switchSprite(sprite) {
            if (this.image === this.sprites.attack1.image && this.framesCurrent < this.sprites.attack1.framesMax - 1) return;
            if (this.image === this.sprites.takeHit.image && this.framesCurrent < this.sprites.takeHit.framesMax - 1) return;

            if (this.image !== this.sprites[sprite].image) {
                this.image = this.sprites[sprite].image;
                this.framesMax = this.sprites[sprite].framesMax;
                this.framesCurrent = 0;
            }
        }
    }

    const cenario = new Sprite({ pos: { x: 0, y: 0 }, imageSrc: path + 'background.png' });

    const player = new Fighter({
        pos: { x: 150, y: 0 },
        vel: { x: 0, y: 0 },
        offset: { x: 215, y: 157 },
        imageSrc: path + 'Idle.png',
        framesMax: 8,
        sprites: {
            idle: { imageSrc: path + 'Idle.png', framesMax: 8 },
            run: { imageSrc: path + 'Run.png', framesMax: 8 },
            jump: { imageSrc: path + 'Jump.png', framesMax: 2 },
            fall: { imageSrc: path + 'Fall.png', framesMax: 2 },
            attack1: { imageSrc: path + 'Attack1.png', framesMax: 6 },
            takeHit: { imageSrc: path + 'Take Hit.png', framesMax: 4 }
        }
    });

    const enemy = new Fighter({
        pos: { x: 800, y: 0 },
        vel: { x: 0, y: 0 },
        offset: { x: 215, y: 157 },
        imageSrc: path + 'Idle.png',
        framesMax: 8,
        sprites: {
            idle: { imageSrc: path + 'Idle.png', framesMax: 8 },
            run: { imageSrc: path + 'Run.png', framesMax: 8 },
            jump: { imageSrc: path + 'Jump.png', framesMax: 2 },
            fall: { imageSrc: path + 'Fall.png', framesMax: 2 },
            attack1: { imageSrc: path + 'Attack1.png', framesMax: 6 },
            takeHit: { imageSrc: path + 'Take Hit.png', framesMax: 4 }
        }
    });

    const keys = { a: { pressed: false }, d: { pressed: false }, ArrowRight: { pressed: false }, ArrowLeft: { pressed: false } };

    /* --- MÓDULO INTELIGÊNCIA ARTIFICIAL --- */
    function processarIA() {
        if (modo !== 'PVC' || !jogoAtivo) return;
        const distanciaX = player.pos.x - enemy.pos.x;

        if (Math.abs(distanciaX) > 110) {
            enemy.vel.x = distanciaX > 0 ? 3 : -3;
            enemy.switchSprite('run');
        } else {
            enemy.vel.x = 0;
            enemy.switchSprite('idle');
            if (Math.random() < 0.05) enemy.attack();
        }

        if (enemy.energy >= 100) {
            enemy.lancarUltimate('#f1c40f');
        } else if (Math.abs(distanciaX) > 320 && Math.random() < 0.015) {
            enemy.lancarMagia('#e67e22');
        }
    }

    function retanguloColisao({ atqBox, alvo }) {
        return (
            atqBox.pos.x <= alvo.pos.x + alvo.width &&
            atqBox.pos.x + atqBox.width >= alvo.pos.x &&
            atqBox.pos.y <= alvo.pos.y + alvo.height &&
            atqBox.pos.y + atqBox.height >= alvo.pos.y
        );
    }

    function checarColisoes() {
        if (player.pos.x <= enemy.pos.x) {
            player.lado = 1;
            enemy.lado = -1;
        } else {
            player.lado = -1;
            enemy.lado = 1;
        }

        // Player 1 ataca Player 2
        if (player.isAttacking && player.framesCurrent === 4 && retanguloColisao({ atqBox: player.attackBox, alvo: enemy })) {
            player.isAttacking = false;
            enemy.health -= 5;
            player.ganharEnergia(20); 
            player.adicionarCombo('#p1Combo'); 
            enemy.switchSprite('takeHit');
            tremor = 5;
            document.querySelector('#p2Health').style.width = Math.max(0, enemy.health) + '%';
        }

        // Player 2 ataca Player 1
        if (enemy.isAttacking && enemy.framesCurrent === 4 && retanguloColisao({ atqBox: enemy.attackBox, alvo: player })) {
            enemy.isAttacking = false;
            player.health -= 5;
            enemy.ganharEnergia(20); 
            enemy.adicionarCombo('#p2Combo'); 
            player.switchSprite('takeHit');
            tremor = 5;
            document.querySelector('#p1Health').style.width = Math.max(0, player.health) + '%';
        }

        // Dano de Magias / Ultimates
        for (let i = player.magias.length - 1; i >= 0; i--) {
            const m = player.magias[i];
            m.atualizar();

            if (m.pos.x >= enemy.pos.x && m.pos.x <= enemy.pos.x + enemy.width &&
                m.pos.y >= enemy.pos.y && m.pos.y <= enemy.pos.y + enemy.height) {
                enemy.health -= m.dano; 
                player.adicionarCombo('#p1Combo'); 
                enemy.switchSprite('takeHit');
                player.magias.splice(i, 1);
                tremor = m.isUltimate ? 15 : 7; 
                document.querySelector('#p2Health').style.width = Math.max(0, enemy.health) + '%';
                continue;
            }
            if (!m.ativo) player.magias.splice(i, 1);
        }

        for (let i = enemy.magias.length - 1; i >= 0; i--) {
            const m = enemy.magias[i];
            m.atualizar();

            if (m.pos.x >= player.pos.x && m.pos.x <= player.pos.x + player.width &&
                m.pos.y >= player.pos.y && m.pos.y <= player.pos.y + player.height) {
                player.health -= m.dano;
                enemy.adicionarCombo('#p2Combo'); 
                player.switchSprite('takeHit');
                enemy.magias.splice(i, 1);
                tremor = m.isUltimate ? 15 : 7;
                document.querySelector('#p1Health').style.width = Math.max(0, player.health) + '%';
                continue;
            }
            if (!m.ativo) enemy.magias.splice(i, 1);
        }

        document.querySelector('#p1Energy').style.width = player.energy + '%';
        document.querySelector('#p2Energy').style.width = enemy.energy + '%';

        if (player.health <= 0 || enemy.health <= 0) finalizarCombate();
    }

    function animate() {
        window.requestAnimationFrame(animate);
        
        ctx.save();
        if (tremor > 0) {
            ctx.translate((Math.random() - 0.5) * tremor, (Math.random() - 0.5) * tremor);
            tremor--;
        }

        cenario.update();

        ctx.fillStyle = 'rgba(20, 20, 20, 0.4)';
        ctx.fillRect(0, canvas.height - 60, canvas.width, 60);

        player.update();
        enemy.update();

        player.vel.x = 0;
        if (keys.a.pressed) {
            player.vel.x = -5;
            player.switchSprite('run');
        } else if (keys.d.pressed) {
            player.vel.x = 5;
            player.switchSprite('run');
        } else {
            player.switchSprite('idle');
        }

        if (player.vel.y < 0) player.switchSprite('jump');
        else if (player.vel.y > 0) player.switchSprite('fall');

        if (modo === 'PVC') {
            processarIA();
        } else {
            enemy.vel.x = 0;
            if (keys.ArrowLeft.pressed) {
                enemy.vel.x = -5;
                enemy.switchSprite('run');
            } else if (keys.ArrowRight.pressed) {
                enemy.vel.x = 5;
                enemy.switchSprite('run');
            } else {
                enemy.switchSprite('idle');
            }

            if (enemy.vel.y < 0) enemy.switchSprite('jump');
            else if (enemy.vel.y > 0) enemy.switchSprite('fall');
        }

        checarColisoes();
        ctx.restore();
    }

    function iniciarJogo(m) {
        modo = m;
        document.querySelector('#telaInicio').style.display = 'none';
        document.querySelector('#ui').style.display = 'flex';
        
        musicaFundo.play().catch(() => {});
        
        resetarLuta();
        animate();
    }

    function resetarLuta() {
        player.health = 100; enemy.health = 100;
        player.energy = 0; enemy.energy = 0; 
        player.comboCount = 0; enemy.comboCount = 0; 
        player.pos = { x: 150, y: 0 }; enemy.pos = { x: 800, y: 0 };
        player.magias = []; enemy.magias = [];
        document.querySelector('#p1Health').style.width = '100%';
        document.querySelector('#p2Health').style.width = '100%';
        document.querySelector('#p1Energy').style.width = '0%';
        document.querySelector('#p2Energy').style.width = '0%';
        document.querySelector('#p1Combo').classList.remove('combo-ativo');
        document.querySelector('#p2Combo').classList.remove('combo-ativo');
        tempo = 60;
        jogoAtivo = true; 
        document.querySelector('#mensagem').style.display = 'none';
        
        if (timerID) clearInterval(timerID);
        timerID = setInterval(() => {
            if (jogoAtivo) {
                tempo--;
                document.querySelector('#timer').innerText = tempo;
                if (tempo <= 0) finalizarCombate();
            }
        }, 1000);
    }

    function finalizarCombate() {
        jogoAtivo = false;
        clearInterval(timerID);
        document.querySelector('#mensagem').style.display = 'flex';
        const txt = document.querySelector('#textoResultado');
        if (player.health === enemy.health) txt.innerText = "EMPATE TÉCNICO";
        else txt.innerText = player.health > enemy.health ? "PLAYER 1 VENCEU!" : "PLAYER 2 VENCEU!";
    }

    /* --- MAPEAMENTO DE ENTRADAS --- */
    window.addEventListener('keydown', (event) => {
        if (!jogoAtivo) return;
        switch (event.key) {
            // Player 1
            case 'd': keys.d.pressed = true; break;
            case 'a': keys.a.pressed = true; break;
            case 'w': 
                if (player.vel.y === 0) {
                    player.vel.y = -18;
                }
                break;
            case ' ': player.attack(); break;
            case 'q': player.lancarMagia('#2ecc71'); break;
            case 'e': player.lancarUltimate('#f1c40f'); break; 

            // Player 2
            case 'ArrowRight': if (modo === 'PVP') keys.ArrowRight.pressed = true; break;
            case 'ArrowLeft': if (modo === 'PVP') keys.ArrowLeft.pressed = true; break;
            case 'ArrowUp': 
                if (modo === 'PVP' && enemy.vel.y === 0) {
                    enemy.vel.y = -18;
                }
                break;
            case 'Enter': if (modo === 'PVP') enemy.attack(); break;
            case 'p': if (modo === 'PVP') enemy.lancarMagia('#3498db'); break;
            case 'o': if (modo === 'PVP') enemy.lancarUltimate('#f1c40f'); break; 
        }
    });

    window.addEventListener('keyup', (event) => {
        switch (event.key) {
            case 'd': keys.d.pressed = false; break;
            case 'a': keys.a.pressed = false; break;
            case 'ArrowRight': keys.ArrowRight.pressed = false; break;
            case 'ArrowLeft': keys.ArrowLeft.pressed = false; break;
        }
    });
</script>
</body>
</html>
