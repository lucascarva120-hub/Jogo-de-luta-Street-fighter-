<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LACK FIGHT - TCC Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Courier New', Courier, monospace; 
        }
        #container { position: relative; border: 5px solid #222; box-shadow: 0 0 50px rgba(0,0,0,0.9); background: #111; }
        
        /* TELA DE INÍCIO ESTILIZADA */
        #telaInicio {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #222 0%, #000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }

        /* ESTILO STREET FIGHTER PARA LACK FIGHT */
        .titulo-jogo {
            font-size: 110px;
            font-style: italic;
            font-weight: 900;
            text-transform: uppercase;
            color: #f1c40f; 
            position: relative;
            /* Camadas de sombra: contorno preto + extrusão vermelha */
            text-shadow: 
                3px 3px 0px #000,
                -1px -1px 0px #000,
                1px -1px 0px #000,
                -1px 1px 0px #000,
                5px 5px 0px #c0392b, 
                8px 8px 0px #7b241c,
                12px 12px 20px rgba(0,0,0,0.8);
            letter-spacing: 2px;
            margin-bottom: 0px;
            transform: skew(-8deg); /* Inclinação dinâmica */
            display: inline-block;
        }

        .subtitulo {
            font-size: 18px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 50px;
            font-weight: bold;
            animation: pulsar 1.5s infinite alternate;
        }

        @keyframes pulsar {
            from { opacity: 0.4; text-shadow: 0 0 5px #fff; }
            to { opacity: 1; text-shadow: 0 0 20px #2ecc71; }
        }

        #btnJogar {
            padding: 18px 60px;
            font-size: 28px;
            background: #2ecc71;
            border: 4px solid #fff;
            cursor: pointer;
            font-weight: bold;
            color: white;
            box-shadow: 0 6px #27ae60;
            transition: 0.1s;
        }
        #btnJogar:active { transform: translateY(4px); box-shadow: 0 2px #27ae60; }

        /* INTERFACE DE COMBATE (HUD) */
        #ui { 
            position: absolute; 
            display: flex; 
            width: 100%; 
            padding: 30px; 
            pointer-events: none; 
            z-index: 10; 
        }
        .hud-player { width: 100%; }
        .nome-lutador { color: white; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; font-size: 18px; }
        .barra-vida-bg { 
            height: 35px; 
            width: 100%; 
            border: 3px solid #fff; 
            background-color: #500; 
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        #playerHealth, #enemyHealth { 
            height: 100%; width: 100%; 
            transition: width 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        #playerHealth { background: linear-gradient(to bottom, #3498db, #2980b9); float: right; }
        #enemyHealth { background: linear-gradient(to bottom, #e67e22, #d35400); float: left; }
        
        #timer { 
            background: #000; 
            min-width: 90px; 
            height: 70px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #fff; 
            font-size: 40px; 
            font-weight: bold; 
            border: 4px solid #fff; 
            margin: 0 25px; 
        }

        #mensagem { 
            position: absolute; 
            color: white; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            top: 0; right: 0; bottom: 0; left: 0; 
            display: none; 
            background: rgba(0,0,0,0.85); 
            z-index: 20; 
        }

        canvas { display: block; }
    </style>
</head>
<body>

    <div id="container">
        <!-- TELA INICIAL -->
        <div id="telaInicio">
            <h1 class="titulo-jogo">LACK FIGHT</h1>
            <p class="subtitulo">Cyber-Knight vs Magma-Brute</p>
            <button id="btnJogar">FIGHT!</button>
            <p style="margin-top: 30px; color: #555; font-size: 11px;">© 2026 DESENVOLVIMENTO DE SISTEMAS - TCC</p>
        </div>

        <!-- HUD DO JOGO -->
        <div id="ui">
            <div class="hud-player">
                <div class="nome-lutador" style="text-align: right;">Cyber-Knight</div>
                <div class="barra-vida-bg"><div id="playerHealth"></div></div>
            </div>
            <div id="timer">60</div>
            <div class="hud-player">
                <div class="nome-lutador">Magma-Brute</div>
                <div class="barra-vida-bg"><div id="enemyHealth"></div></div>
            </div>
        </div>

        <!-- TELA DE FIM DE JOGO -->
        <div id="mensagem">
            <h1 id="textoVitoria" style="font-size: 60px; color: #f1c40f;">K.O.</h1>
            <p style="font-size: 20px;">Pressione 'R' para Revanche</p>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
    const canvas = document.querySelector('canvas');
    const c = canvas.getContext('2d');
    canvas.width = 1024;
    canvas.height = 576;

    const gravidade = 0.7;
    let jogoAtivo = false;
    let tremorTempo = 0;
    let musicaTocando = false;

    // --- SONS ---
    const sons = {
        soco: new Audio('https://www.soundjay.com/human/sounds/punch-on-boxing-bag-01.mp3'),
        pulo: new Audio('https://www.soundjay.com/button/sounds/button-21.mp3'),
        hadouken: new Audio('https://www.soundjay.com/magic/sounds/magic-chime-01.mp3')
    };

    const musicaGuile = new Audio('guile.mp3'); 
    musicaGuile.loop = true;
    musicaGuile.volume = 0.25;

    // --- INICIALIZAÇÃO ---
    document.querySelector('#btnJogar').addEventListener('click', () => {
        document.querySelector('#telaInicio').style.display = 'none';
        musicaGuile.play().catch(e => console.log("Verifique se guile.mp3 está na pasta do projeto."));
        musicaTocando = true;
        jogoAtivo = true;
        reiniciar();
    });

    function tocarSom(nome) {
        if (musicaTocando) {
            sons[nome].currentTime = 0;
            sons[nome].play().catch(() => {});
        }
    }

    // --- CLASSES ---
    class Projetil {
        constructor({ posicao, velocidade, cor, dano }) {
            this.posicao = posicao;
            this.velocidade = velocidade;
            this.cor = cor;
            this.raio = 15;
            this.dano = dano;
            this.marcadoParaExcluir = false;
        }
        desenhar() {
            c.beginPath();
            c.arc(this.posicao.x, this.posicao.y, this.raio, 0, Math.PI * 2);
            c.fillStyle = this.cor;
            c.fill();
            c.shadowBlur = 20;
            c.shadowColor = this.cor;
            c.closePath();
            c.shadowBlur = 0;
        }
        atualizar() {
            this.desenhar();
            this.posicao.x += this.velocidade.x;
            if (this.posicao.x > canvas.width || this.posicao.x < 0) this.marcadoParaExcluir = true;
        }
    }

    class Personagem {
        constructor({ posicao, cor, offset, direcao, nome, atributos }) {
            this.posicao = posicao;
            this.velocidade = { x: 0, y: 0 };
            this.cor = cor;
            this.largura = 60;
            this.altura = 150;
            this.direcao = direcao;
            this.nome = nome;
            this.atributos = atributos;
            this.caixaAtaque = {
                posicao: { x: this.posicao.x, y: this.posicao.y },
                offset: offset,
                largura: 120,
                altura: 50
            };
            this.estaAtacando = false;
            this.vida = 100;
            this.projeteis = [];
        }

        desenhar() {
            c.fillStyle = this.cor;
            c.fillRect(this.posicao.x, this.posicao.y, this.largura, this.altura);
            
            // Visual de "Olhos"
            c.fillStyle = 'rgba(0,0,0,0.5)';
            const eyeX = this.direcao === 1 ? this.posicao.x + 35 : this.posicao.x + 10;
            c.fillRect(eyeX, this.posicao.y + 20, 15, 10);

            if (this.estaAtacando) {
                c.fillStyle = 'rgba(255,255,255,0.3)';
                c.fillRect(this.caixaAtaque.posicao.x, this.caixaAtaque.posicao.y, this.caixaAtaque.largura, this.caixaAtaque.altura);
            }
        }

        atualizar() {
            this.desenhar();
            this.projeteis.forEach((p, i) => {
                p.atualizar();
                if (p.marcadoParaExcluir) this.projeteis.splice(i, 1);
            });

            this.caixaAtaque.posicao.x = this.posicao.x + this.caixaAtaque.offset.x;
            this.caixaAtaque.posicao.y = this.posicao.y + 30;

            this.posicao.x += this.velocidade.x;
            this.posicao.y += this.velocidade.y;

            if (this.posicao.y + this.altura + this.velocidade.y >= canvas.height - 60) {
                this.velocidade.y = 0;
                this.posicao.y = canvas.height - 60 - this.altura;
            } else this.velocidade.y += gravidade;

            if (this.posicao.x < 0) this.posicao.x = 0;
            if (this.posicao.x + this.largura > canvas.width) this.posicao.x = canvas.width - this.largura;
        }

        atacar() {
            if (!jogoAtivo) return;
            this.estaAtacando = true;
            tocarSom('soco');
            setTimeout(() => { this.estaAtacando = false; }, 120);
        }

        lancarPoder() {
            if (!jogoAtivo || this.projeteis.length >= 2) return;
            tocarSom('hadouken');
            this.projeteis.push(new Projetil({
                posicao: { x: this.posicao.x + (this.direcao === 1 ? 60 : 0), y: this.posicao.y + 60 },
                velocidade: { x: 13 * this.direcao, y: 0 },
                cor: this.atributos.corPoder,
                dano: this.atributos.danoPoder
            }));
        }
    }

    // --- DEFINIÇÃO DOS LUTADORES LACK FIGHT ---
    const jogador1 = new Personagem({
        posicao: { x: 150, y: 0 },
        cor: '#3498db',
        offset: { x: 0, y: 50 },
        direcao: 1,
        nome: 'Cyber-Knight',
        atributos: {
            velocidadeMov: 9,
            danoSoco: 0.5,
            danoPoder: 8,
            corPoder: '#00fbff'
        }
    });

    const jogador2 = new Personagem({
        posicao: { x: 800, y: 0 },
        cor: '#e67e22',
        offset: { x: -60, y: 50 },
        direcao: -1,
        nome: 'Magma-Brute',
        atributos: {
            velocidadeMov: 5.5,
            danoSoco: 0.9,
            danoPoder: 15,
            corPoder: '#ff4500'
        }
    });

    const teclas = {
        a: { pressionada: false }, d: { pressionada: false },
        ArrowRight: { pressionada: false }, ArrowLeft: { pressionada: false }
    };

    let tempo = 60;
    let timerID;

    function diminuirTempo() {
        if (tempo > 0 && jogoAtivo) {
            timerID = setTimeout(diminuirTempo, 1000);
            tempo--;
            document.querySelector('#timer').innerHTML = tempo;
        }
        if (tempo === 0) determinarVencedor();
    }

    function determinarVencedor() {
        jogoAtivo = false;
        clearTimeout(timerID);
        document.querySelector('#mensagem').style.display = 'flex';
        const texto = document.querySelector('#textoVitoria');
        if (jogador1.vida === jogador2.vida) texto.innerHTML = 'DRAW';
        else texto.innerHTML = jogador1.vida > jogador2.vida ? 'CYBER-KNIGHT WINS' : 'MAGMA-BRUTE WINS';
    }

    function reiniciar() {
        jogador1.vida = 100; jogador2.vida = 100;
        jogador1.posicao = { x: 150, y: 0 }; jogador2.posicao = { x: 800, y: 0 };
        jogador1.projeteis = []; jogador2.projeteis = [];
        tempo = 60; jogoAtivo = true;
        document.querySelector('#playerHealth').style.width = '100%';
        document.querySelector('#enemyHealth').style.width = '100%';
        document.querySelector('#mensagem').style.display = 'none';
        clearTimeout(timerID);
        diminuirTempo();
    }

    function animar() {
        window.requestAnimationFrame(animar);
        c.save();
        if (tremorTempo > 0) {
            c.translate((Math.random()-0.5)*12, (Math.random()-0.5)*12);
            tremorTempo--;
        }

        // BACKGROUND
        c.fillStyle = '#0a0a1a';
        c.fillRect(0, 0, canvas.width, canvas.height);
        
        // FLOOR
        c.fillStyle = '#222';
        c.fillRect(0, canvas.height - 60, canvas.width, 60);
        c.strokeStyle = '#444';
        for(let i=0; i<canvas.width; i+=80) c.strokeRect(i, canvas.height-60, 80, 60);

        jogador1.atualizar();
        jogador2.atualizar();

        // COLISÕES PODERES
        [jogador1, jogador2].forEach(j => {
            const inimigo = j === jogador1 ? jogador2 : jogador1;
            const hBar = j === jogador1 ? '#enemyHealth' : '#playerHealth';
            j.projeteis.forEach((p, i) => {
                if (p.posicao.x + p.raio >= inimigo.posicao.x && 
                    p.posicao.x - p.raio <= inimigo.posicao.x + inimigo.largura &&
                    p.posicao.y >= inimigo.posicao.y && p.posicao.y <= inimigo.posicao.y + inimigo.altura) {
                    inimigo.vida -= p.dano;
                    tremorTempo = 15;
                    document.querySelector(hBar).style.width = (inimigo.vida < 0 ? 0 : inimigo.vida) + '%';
                    j.projeteis.splice(i, 1);
                }
            });
        });

        // INPUTS
        jogador1.velocidade.x = 0;
        jogador2.velocidade.x = 0;

        if (jogoAtivo) {
            if (teclas.a.pressionada) { jogador1.velocidade.x = -jogador1.atributos.velocidadeMov; jogador1.direcao = -1; jogador1.caixaAtaque.offset.x = -60; }
            else if (teclas.d.pressionada) { jogador1.velocidade.x = jogador1.atributos.velocidadeMov; jogador1.direcao = 1; jogador1.caixaAtaque.offset.x = 0; }

            if (teclas.ArrowLeft.pressionada) { jogador2.velocidade.x = -jogador2.atributos.velocidadeMov; jogador2.direcao = -1; jogador2.caixaAtaque.offset.x = -60; }
            else if (teclas.ArrowRight.pressionada) { jogador2.velocidade.x = jogador2.atributos.velocidadeMov; jogador2.direcao = 1; jogador2.caixaAtaque.offset.x = 0; }
        }

        // COLISÕES SOCO
        if (jogador1.estaAtacando && jogador1.caixaAtaque.posicao.x + jogador1.caixaAtaque.largura >= jogador2.posicao.x && jogador1.caixaAtaque.posicao.x <= jogador2.posicao.x + jogador2.largura && jogador1.caixaAtaque.posicao.y + jogador1.caixaAtaque.altura >= jogador2.posicao.y && jogador1.caixaAtaque.posicao.y <= jogador2.posicao.y + jogador2.altura) {
            jogador2.vida -= jogador1.atributos.danoSoco;
            document.querySelector('#enemyHealth').style.width = (jogador2.vida < 0 ? 0 : jogador2.vida) + '%';
            tremorTempo = 6;
        }

        if (jogador2.estaAtacando && jogador2.caixaAtaque.posicao.x + jogador2.caixaAtaque.largura >= jogador1.posicao.x && jogador2.caixaAtaque.posicao.x <= jogador1.posicao.x + jogador1.largura && jogador2.caixaAtaque.posicao.y + jogador2.caixaAtaque.altura >= jogador1.posicao.y && jogador2.caixaAtaque.posicao.y <= jogador1.posicao.y + jogador1.altura) {
            jogador1.vida -= jogador2.atributos.danoSoco;
            document.querySelector('#playerHealth').style.width = (jogador1.vida < 0 ? 0 : jogador1.vida) + '%';
            tremorTempo = 6;
        }

        if (jogador1.vida <= 0 || jogador2.vida <= 0) determinarVencedor();
        c.restore();
    }

    animar();

    window.addEventListener('keydown', (event) => {
        if (jogoAtivo) {
            switch (event.key) {
                case 'd': teclas.d.pressionada = true; break;
                case 'a': teclas.a.pressionada = true; break;
                case 'w': if (jogador1.velocidade.y === 0) { jogador1.velocidade.y = -20; tocarSom('pulo'); } break;
                case ' ': jogador1.atacar(); break;
                case 'q': case 'Q': jogador1.lancarPoder(); break;

                case 'ArrowRight': teclas.ArrowRight.pressionada = true; break;
                case 'ArrowLeft': teclas.ArrowLeft.pressionada = true; break;
                case 'ArrowUp': if (jogador2.velocidade.y === 0) { jogador2.velocidade.y = -20; tocarSom('pulo'); } break;
                case 'Enter': jogador2.atacar(); break;
                case 'p': case 'P': jogador2.lancarPoder(); break;
            }
        }
        if (event.key.toLowerCase() === 'r') reiniciar();
    });

    window.addEventListener('keyup', (event) => {
        switch (event.key) {
            case 'd': teclas.d.pressionada = false; break;
            case 'a': teclas.a.pressionada = false; break;
            case 'ArrowRight': teclas.ArrowRight.pressionada = false; break;
            case 'ArrowLeft': teclas.ArrowLeft.pressionada = false; break;
        }
    });
</script>
</body>
</html>
